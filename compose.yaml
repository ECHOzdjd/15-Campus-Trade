name: campus-trade

services:
  mysql:
    image: mysql:8.0
    container_name: campus-trade-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: campus_trade
      MYSQL_USER: campustrade
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-devpass}
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./backend/src/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./backend/src/scripts/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    container_name: campus-trade-backend
    restart: unless-stopped
    command: ["npx", "nodemon", "--legacy-watch", "src/app.js"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: campustrade
      DB_PASSWORD: ${MYSQL_PASSWORD:-devpass}
      DB_NAME: campus_trade
      JWT_SECRET: ${JWT_SECRET:-devsecret}
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: campus-trade-frontend
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "80:5173"
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  backend-node-modules:
  frontend-node-modules:
